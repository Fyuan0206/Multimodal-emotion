const main=document.querySelector('#main');
clips.forEach((c,ci)=>{const section=document.createElement('section');section.innerHTML=`<h2>音频${ci+1}　0–${c.duration.toFixed(3)}秒</h2><p>${c.text}</p><audio controls preload="metadata" src="${c.file}"></audio><label>速度 <select class="speed"><option value="1">1倍</option><option value="0.75">0.75倍</option><option value="0.5">0.5倍</option></select></label><strong class="clock">0.000 秒</strong><p>重点回听 ${c.focus_window} 秒；范围不是词边界答案。</p><label>跳到秒数 <input class="seek" type="number" min="0" step="0.01" value="0"></label><button class="jump">跳转</button><button class="back">后退0.05秒</button><button class="forward">前进0.05秒</button>`;
main.append(section);const video=section.querySelector('audio');video.ontimeupdate=()=>section.querySelector('.clock').textContent=video.currentTime.toFixed(3)+' 秒';section.querySelector('.speed').onchange=e=>video.playbackRate=Number(e.target.value);section.querySelector('.jump').onclick=()=>{video.pause();video.currentTime=Math.max(0,Math.min(c.duration,Number(section.querySelector('.seek').value)))};section.querySelector('.back').onclick=()=>{video.pause();video.currentTime=Math.max(0,video.currentTime-.05)};section.querySelector('.forward').onclick=()=>{video.pause();video.currentTime=Math.min(c.duration,video.currentTime+.05)};
rows.forEach((r,i)=>{if(r.sample_id!==c.sample_id)return;const box=document.createElement('div');box.className='word';box.dataset.index=i;box.innerHTML=`<h3>${r.word}</h3><small>${r.sample_id} · 源词索引 ${r.word_index}</small><label>起点秒 <input class="start" type="number" min="0" max="${c.audio_end}" step="0.001"></label><button class="setstart">用当前时间填起点</button><label>终点秒 <input class="end" type="number" min="0" max="${c.audio_end}" step="0.001"></label><button class="setend">用当前时间填终点</button><br><label>状态 <select class="status"><option value="pending">尚未听</option><option value="confirmed">已确认</option><option value="uncertain">边界不确定</option><option value="not_heard">未听到目标词</option><option value="transcript_mismatch">转写不符</option></select></label><label>把握 <select class="confidence"><option value="">未选择</option><option>high</option><option>medium</option><option>low</option></select></label><label>主要回听倍速 <input class="rate" type="number" min="0.25" max="2" step="0.25" placeholder="例如0.5"></label><textarea class="note" placeholder="备注：连读、静音、噪声、实际听到的词、只能确定一端等"></textarea>`;section.append(box);box.querySelector('.setstart').onclick=()=>box.querySelector('.start').value=video.currentTime.toFixed(3);box.querySelector('.setend').onclick=()=>box.querySelector('.end').value=video.currentTime.toFixed(3);});});
document.querySelector('#download').onclick=()=>{let errors=[];const reviewer=document.querySelector('#reviewer').value.trim(),date=document.querySelector('#date').value;const result=rows.map((r,i)=>{const b=document.querySelector(`[data-index="${i}"]`),value=s=>b.querySelector(s).value;const start=value('.start'),end=value('.end'),status=value('.status'),clip=clips.find(c=>c.sample_id===r.sample_id);if(status==='confirmed'&&(!reviewer||!date||!value('.confidence')||!value('.rate')))errors.push(r.word+'：已确认记录须填写回听人、日期、把握和速度');if((start==='')!==(end===''))errors.push(r.word+'：请成对填写时间；仅确定一端时写入备注');if(status==='confirmed'&&(start===''||end===''))errors.push(r.word+'：已确认记录必须有起止时间');if(start!==''&&end!==''&&!(Number(start)>=0&&Number(end)>Number(start)&&Number(end)<=clip.audio_end))errors.push(r.word+'：时间范围无效');if(['not_heard','transcript_mismatch'].includes(status)&&(start!==''||end!==''))errors.push(r.word+'：该状态请清空时间并说明原因');return {...r,reference_start_s:start===''?null:Number(start),reference_end_s:end===''?null:Number(end),review_status:status,confidence:value('.confidence'),reviewer,review_date:date,playback_rate:value('.rate'),reviewer_note:value('.note')};});if(errors.length){document.querySelector('#message').textContent=errors.join('\n');return;}const blob=new Blob([JSON.stringify({schema_version:'q1-human-review-1',review_scope:'duration_stratified_10_clips',time_origin:'original_clip_seconds',records:result},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Q1_有声10条回听记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector('#message').textContent='已下载记录。请保留并交回该JSON文件。';};
