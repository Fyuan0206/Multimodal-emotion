<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Q1 六词回听记录</title><style>
body{font:16px/1.6 system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 20px;color:#243746;background:#f7f9fb}section{background:white;padding:20px;margin:22px 0;border:1px solid #dae2e8;border-radius:10px}video{width:min(100%,640px);display:block}input,select,textarea,button{font:inherit;padding:6px;border:1px solid #b9c8d3;border-radius:4px}button{cursor:pointer;background:#e4edf4;margin:5px}input[type=number]{width:100px}label{display:inline-block;margin:5px}textarea{width:95%;height:55px}.word{border-top:1px solid #ddd;padding-top:12px;margin-top:15px}.notice{color:#7b3b3b}small{display:block}h1,h2,h3{font-weight:600}#message{white-space:pre-wrap}</style>
<h1>Q1 六词回听记录（音源无声，暂停核验）</h1><p class="notice"><strong>已核实：两段原始音轨均为全零数字静音。请勿继续填写词边界或标记“已确认”。这不是播放设备问题。现有时间不能作为可信语音边界，待取得有声原素材后再核验。</strong></p><p>先完整听一遍，再逐词定位。所有时间均为原视频秒数，慢速播放无需换算。请同时阅读同目录的“回听操作说明.md”。</p><p class="notice">不预填机器边界。页面不会自动保存，关闭或刷新前请下载记录。不确定时如实标记，勿猜测。</p><label>回听人 <input id="reviewer" placeholder="姓名或代号"></label><label>实际日期 <input id="date" type="date"></label><main id="main"></main><button id="download">下载填写结果</button><p id="message"></p><script>
const clips=[{"sample_id": "-mJ2ud6oKI8__1", "file": "素材/视频1.mp4", "text": "There are a dozen or more hands on techniques that we can do", "duration": 6.103, "audio_end": 6.0545, "focus_window": "0.30–5.70", "sha256": "c8e3acb4ca08679796c4c8cdfcd8c2b3cffc0465015efaffa1eccdb55ff4f45b"}, {"sample_id": "-mJ2ud6oKI8__2", "file": "素材/视频2.mp4", "text": "So physical therapists and chiropractors will do joint manipulations and mobilizations", "duration": 5.731, "audio_end": 5.7016875, "focus_window": "0.20–5.10", "sha256": "c41790f8b75f886bd1f5d6d72cbab1985306d0b715e5ae47203f3d0c8a3e7b28"}], rows=[{"sample_id": "-mJ2ud6oKI8__1", "word_index": 4, "word": "or", "reference_start_s": "", "reference_end_s": "", "review_status": "pending", "confidence": "", "reviewer": "", "review_date": "", "playback_rate": "", "reviewer_note": ""}, {"sample_id": "-mJ2ud6oKI8__1", "word_index": 5, "word": "more", "reference_start_s": "", "reference_end_s": "", "review_status": "pending", "confidence": "", "reviewer": "", "review_date": "", "playback_rate": "", "reviewer_note": ""}, {"sample_id": "-mJ2ud6oKI8__1", "word_index": 6, "word": "hands", "reference_start_s": "", "reference_end_s": "", "review_status": "pending", "confidence": "", "reviewer": "", "review_date": "", "playback_rate": "", "reviewer_note": ""}, {"sample_id": "-mJ2ud6oKI8__2", "word_index": 2, "word": "therapists", "reference_start_s": "", "reference_end_s": "", "review_status": "pending", "confidence": "", "reviewer": "", "review_date": "", "playback_rate": "", "reviewer_note": ""}, {"sample_id": "-mJ2ud6oKI8__2", "word_index": 3, "word": "and", "reference_start_s": "", "reference_end_s": "", "review_status": "pending", "confidence": "", "reviewer": "", "review_date": "", "playback_rate": "", "reviewer_note": ""}, {"sample_id": "-mJ2ud6oKI8__2", "word_index": 4, "word": "chiropractors", "reference_start_s": "", "reference_end_s": "", "review_status": "pending", "confidence": "", "reviewer": "", "review_date": "", "playback_rate": "", "reviewer_note": ""}];
const main=document.querySelector('#main');
clips.forEach((c,ci)=>{const section=document.createElement('section');section.innerHTML=`<h2>视频${ci+1}　0–${c.duration.toFixed(3)}秒</h2><p>${c.text}</p><video controls preload="metadata" src="${c.file}"></video><label>速度 <select class="speed"><option value="1">1倍</option><option value="0.75">0.75倍</option><option value="0.5">0.5倍</option></select></label><strong class="clock">0.000 秒</strong><p>重点回听 ${c.focus_window} 秒；范围不是词边界答案。</p><label>跳到秒数 <input class="seek" type="number" min="0" step="0.01" value="0"></label><button class="jump">跳转</button><button class="back">后退0.05秒</button><button class="forward">前进0.05秒</button>`;
main.append(section);const video=section.querySelector('video');video.ontimeupdate=()=>section.querySelector('.clock').textContent=video.currentTime.toFixed(3)+' 秒';section.querySelector('.speed').onchange=e=>video.playbackRate=Number(e.target.value);section.querySelector('.jump').onclick=()=>{video.pause();video.currentTime=Math.max(0,Math.min(c.duration,Number(section.querySelector('.seek').value)))};section.querySelector('.back').onclick=()=>{video.pause();video.currentTime=Math.max(0,video.currentTime-.05)};section.querySelector('.forward').onclick=()=>{video.pause();video.currentTime=Math.min(c.duration,video.currentTime+.05)};
rows.forEach((r,i)=>{if(r.sample_id!==c.sample_id)return;const box=document.createElement('div');box.className='word';box.dataset.index=i;box.innerHTML=`<h3>${r.word}</h3><small>${r.sample_id} · 源词索引 ${r.word_index}</small><label>起点秒 <input class="start" type="number" min="0" max="${c.audio_end}" step="0.001"></label><button class="setstart">用当前时间填起点</button><label>终点秒 <input class="end" type="number" min="0" max="${c.audio_end}" step="0.001"></label><button class="setend">用当前时间填终点</button><br><label>状态 <select class="status"><option value="pending">尚未听</option><option value="confirmed" disabled>已确认（音源无声，停用）</option><option value="uncertain">边界不确定</option><option value="not_heard">未听到目标词</option><option value="transcript_mismatch">转写不符</option></select></label><label>把握 <select class="confidence"><option value="">未选择</option><option>high</option><option>medium</option><option>low</option></select></label><label>主要回听倍速 <input class="rate" type="number" min="0.25" max="2" step="0.25" placeholder="例如0.5"></label><textarea class="note" placeholder="备注：连读、静音、噪声、实际听到的词、只能确定一端等"></textarea>`;section.append(box);box.querySelector('.setstart').onclick=()=>box.querySelector('.start').value=video.currentTime.toFixed(3);box.querySelector('.setend').onclick=()=>box.querySelector('.end').value=video.currentTime.toFixed(3);});});
document.querySelector('#download').onclick=()=>{let errors=[];const reviewer=document.querySelector('#reviewer').value.trim(),date=document.querySelector('#date').value;const result=rows.map((r,i)=>{const b=document.querySelector(`[data-index="${i}"]`),value=s=>b.querySelector(s).value;const start=value('.start'),end=value('.end'),status=value('.status'),clip=clips.find(c=>c.sample_id===r.sample_id);if(status==='confirmed'&&(!reviewer||!date||!value('.confidence')||!value('.rate')))errors.push(r.word+'：已确认记录须填写回听人、日期、把握和速度');if((start==='')!==(end===''))errors.push(r.word+'：请成对填写时间；仅确定一端时写入备注');if(status==='confirmed'&&(start===''||end===''))errors.push(r.word+'：已确认记录必须有起止时间');if(start!==''&&end!==''&&!(Number(start)>=0&&Number(end)>Number(start)&&Number(end)<=clip.audio_end))errors.push(r.word+'：时间范围无效');if(['not_heard','transcript_mismatch'].includes(status)&&(start!==''||end!==''))errors.push(r.word+'：该状态请清空时间并说明原因');return {...r,reference_start_s:start===''?null:Number(start),reference_end_s:end===''?null:Number(end),review_status:status,confidence:value('.confidence'),reviewer,review_date:date,playback_rate:value('.rate'),reviewer_note:value('.note')};});if(errors.length){document.querySelector('#message').textContent=errors.join('\n');return;}const blob=new Blob([JSON.stringify({schema_version:'q1-targeted-human-review-1',time_origin:'original_clip_seconds',records:result},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Q1_六词回听记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.querySelector('#message').textContent='已下载记录。请保留并交回该JSON文件。';};
</script></html>
